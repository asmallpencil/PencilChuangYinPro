# FILE: gradle/libs.versions.toml
[versions]
agp = "8.10.1"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
navigationCompose = "2.8.5"
coreKtx = "1.15.0"
profileInstaller = "1.4.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
material3Expressive = "1.3.1"
materialKolor = "4.0.1"
datastore = "1.1.1"
# SAF 目录写入（产物输出路径授权后按 DocumentFile 逐级创建/写入）
documentFile = "1.0.1"
accompanistPermissions = "0.36.0"
opencv = "4.10.0"
cameraX = "1.4.2"
exifinterface = "1.3.7"
junit = "4.13.2"
# feature:pixiv 自研 P 站客户端网络/图片栈
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.9.0"
coil = "2.7.0"
# ZoomImage（panpf/zoomimage）：手势缩放 / 双击放大 / 超大图子采样，替换自研简易查看器
zoomImage = "1.4.0"
# core:backdrop —— 液态玻璃 Kotlin/Compose 实现（Kyant0/AndroidLiquidGlass）
jetbrainsAnnotations = "26.1.0"
# Google ADK for Kotlin（AI 工具链 @Tool/@Param 注解 + KSP 生成器）
googleAdk = "0.2.0"
# androidx.graphics.shapes：RoundedPolygon / Morph —— 真实形状形变（M3 Expressive 加载指示器）
graphicsShapes = "1.0.1"
# FairScan 内嵌依赖（GPL-3.0 文稿扫描）
litert = "1.4.1"
# 2.11.x 要求 compileSdk 36；本项目为 35，取 2.9.0（API 与本项目用法一致）。
zoomable = "2.9.0"
reorderable = "3.0.0"
kotlinxCollectionsImmutable = "0.5.2"

[libraries]
# Google ADK for Kotlin
google-adk-core = { module = "com.google.adk:google-adk-kotlin-core-android", version.ref = "googleAdk" }
google-adk-processor = { module = "com.google.adk:google-adk-kotlin-processor", version.ref = "googleAdk" }

# AndroidX core / lifecycle
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose BOM + UI surface
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Expressive" }
androidx-compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Material 3 Expressive generation
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# 形状形变（M3 Expressive LoadingIndicator 的 morph 能力）
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }

# Persistence
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }

# Permissions
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }

# CameraX
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }

# 照片 EXIF 方向归一化
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# OpenCV（本地文档扫描算法；官方 Maven 制品，含原生库）
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# DI (Hilt)
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }

# core:agent-processor —— @Tool/@Param 注解 KSP 处理器
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# feature:pixiv —— Retrofit / OkHttp / kotlinx.serialization / Coil
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization-converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
zoomimage-compose-coil2 = { module = "io.github.panpf.zoomimage:zoomimage-compose-coil2", version.ref = "zoomImage" }

# core:backdrop —— 液态玻璃 Kotlin/Compose 实现
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }

# FairScan 内嵌依赖
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-support = { module = "com.google.ai.edge.litert:litert-support", version.ref = "litert" }
litert-metadata = { module = "com.google.ai.edge.litert:litert-metadata", version.ref = "litert" }
zoomable = { module = "net.engawapg.lib:zoomable", version.ref = "zoomable" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }